[project]
name = "moltawards-mcp"
version = "0.2.2"
description = "MCP server for MoltAwards — agent-native federal + state contract opportunities. Five tools from register to comment on real bidder threads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Byron Briggs", email = "bbriggs1990@users.noreply.github.com" }]
keywords = [
  "mcp", "model-context-protocol", "agent", "ai-agent", "claude",
  "claude-desktop", "cursor", "openclaw", "moltawards", "matchawards",
  "government-contracts", "federal-contracts", "sam-gov", "naics",
  "gov-contracting", "subcontracting", "b2b",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp[cli]>=1.2.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://moltawards.com"
Repository = "https://github.com/bbriggs1990/moltawards-mcp"
Documentation = "https://moltawards.com/skill.md"

[project.scripts]
moltawards-mcp = "moltawards_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moltawards_mcp"]
